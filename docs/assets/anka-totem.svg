<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 1024 1024" role="img" aria-label="Anka totem">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#22161c"/>
      <stop offset="55%" stop-color="#171219"/>
      <stop offset="100%" stop-color="#0d0b12"/>
    </radialGradient>
    <radialGradient id="ember" cx="50%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#ff7a3d" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#e4572e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#e4572e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e4572e"/>
      <stop offset="55%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#ffc15e"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#c73e1d"/>
      <stop offset="60%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#ffd68a"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc15e"/>
      <stop offset="100%" stop-color="#c73e1d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2f36"/>
      <stop offset="50%" stop-color="#6b4a3a"/>
      <stop offset="100%" stop-color="#3a2f36"/>
    </linearGradient>
  </defs>

  <!-- medallion -->
  <circle cx="512" cy="470" r="430" fill="url(#bg)"/>
  <circle cx="512" cy="470" r="430" fill="url(#ember)"/>
  <circle cx="512" cy="470" r="418" fill="none" stroke="url(#ring)" stroke-width="5"/>
  <circle cx="512" cy="470" r="396" fill="none" stroke="#3a2f36" stroke-width="1.5" opacity="0.8"/>

  <!-- ============ right wing: four layered flame feathers ============ -->
  <g id="wing">
    <path d="M 536 436 C 670 420 800 340 826 238 C 810 330 690 430 536 466 Z"
          fill="url(#flameOuter)"/>
    <path d="M 538 472 C 660 458 762 386 806 274 C 776 368 680 448 538 496 Z"
          fill="url(#flame)"/>
    <path d="M 540 502 C 640 492 722 432 754 336 C 726 414 646 468 540 514 Z"
          fill="#ffb35c"/>
    <path d="M 542 522 C 620 514 682 470 708 398 C 686 458 620 496 542 532 Z"
          fill="#ffd68a"/>
    <!-- memory sparks along the feathers -->
    <g fill="#ffe3ae">
      <circle cx="700" cy="308" r="6"/>
      <circle cx="668" cy="392" r="5"/>
      <circle cx="626" cy="444" r="4"/>
    </g>
  </g>
  <use href="#wing" transform="translate(1024 0) scale(-1 1)"/>

  <!-- ============ body ============ -->
  <!-- torso: compact rising flame -->
  <path d="M 512 322
           C 548 380 560 448 546 502
           C 538 532 526 556 512 578
           C 498 556 486 532 478 502
           C 464 448 476 380 512 322 Z"
        fill="url(#flame)"/>
  <!-- head -->
  <path d="M 512 262
           C 528 280 532 304 522 322
           C 517 331 514 336 512 340
           C 510 336 507 331 502 322
           C 492 304 496 280 512 262 Z"
        fill="#ffd68a"/>
  <!-- crown: solid flame, not strokes -->
  <path d="M 512 188 C 523 210 523 232 512 250 C 501 232 501 210 512 188 Z" fill="#ffc15e"/>
  <path d="M 493 214 C 502 228 505 242 500 254 C 490 244 486 230 493 214 Z" fill="#ff8c42" opacity="0.9"/>
  <path d="M 531 214 C 522 228 519 242 524 254 C 534 244 538 230 531 214 Z" fill="#ff8c42" opacity="0.9"/>

  <!-- ============ tail: fan of flame ribbons ============ -->
  <path d="M 512 572 C 530 660 528 740 512 812 C 496 740 494 660 512 572 Z" fill="url(#tail)"/>
  <path d="M 488 566 C 468 644 464 710 448 782 C 434 706 452 628 478 568 Z" fill="#ff8c42" opacity="0.95"/>
  <path d="M 536 566 C 556 644 560 710 576 782 C 590 706 572 628 546 568 Z" fill="#ff8c42" opacity="0.95"/>
  <path d="M 470 556 C 448 610 440 650 424 700 C 414 646 436 592 462 558 Z" fill="#e4572e" opacity="0.75"/>
  <path d="M 554 556 C 576 610 584 650 600 700 C 610 646 588 592 562 558 Z" fill="#e4572e" opacity="0.75"/>
  <!-- ember tips -->
  <g fill="#ffc15e">
    <circle cx="512" cy="824" r="8"/>
    <circle cx="446" cy="794" r="5.5"/>
    <circle cx="578" cy="794" r="5.5"/>
    <circle cx="421" cy="712" r="4" opacity="0.85"/>
    <circle cx="603" cy="712" r="4" opacity="0.85"/>
  </g>

  <!-- ============ wordmark ============ -->
  <text x="512" y="962" text-anchor="middle"
        font-family="'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="86" font-weight="700" letter-spacing="30" fill="#f3e9dc">ANKA</text>
  <text x="527" y="1006" text-anchor="middle"
        font-family="'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="27" letter-spacing="9" fill="#b98d5f">MEMORY, REBORN</text>
</svg>
