services:
  engram-sync:
    build:
      context: ../..
      dockerfile: crates/engram-sync/Dockerfile
    image: engram-sync:0.1
    container_name: engram-sync
    ports:
      - "8788:8788"
    environment:
      ENGRAM_SYNC_TOKEN: ${ENGRAM_SYNC_TOKEN:-change-me}
      ENGRAM_SYNC_DB: /data/sync.db
      ENGRAM_SYNC_LISTEN: 0.0.0.0:8788
      RUST_LOG: info
    volumes:
      - engram-sync-data:/data
    restart: unless-stopped

volumes:
  engram-sync-data:
