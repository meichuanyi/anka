name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 桌面端：Windows 安装包 / macOS (Apple Silicon) / Linux (AppImage + deb)
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-latest, args: "" }
          - { platform: macos-latest, args: "--target aarch64-apple-darwin" }
          - { platform: ubuntu-22.04, args: "" }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop
      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Anka ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}


  # anka-mcp 独立二进制：远程设备的 MCP 桥接器
  agent-mcp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build anka-mcp
        run: cargo build --release -p anka-mcp --target ${{ matrix.target }}
      - name: Rename
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/anka-mcp${{ matrix.ext }} dist/anka-mcp-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: anka-mcp-${{ matrix.target }}
          path: dist/
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/anka-mcp-*
  # Android：构建可安装的 APK（debug 签名，可直接安装）
  android:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      # gradle daemon is flaky on hosted runners (dies on startup)
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"
    steps:
      - uses: actions/checkout@v4
      # AGP requires Java 17; runner default is 11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Locate preinstalled NDK
        run: echo "NDK_HOME=$(ls -d $ANDROID_HOME/ndk/*/ | sort | tail -1)" >> $GITHUB_ENV
      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop
      - name: Build APK
        working-directory: apps/desktop
        run: npx tauri android build --apk --target aarch64 --debug
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
