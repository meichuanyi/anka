name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 桌面端：Windows 安装包 / macOS (Apple Silicon) / Linux (AppImage + deb)
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-latest, args: "" }
          - { platform: macos-latest, args: "--target aarch64-apple-darwin" }
          - { platform: ubuntu-22.04, args: "" }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop
      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Anka ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Android：构建可安装的 APK（debug 签名，可直接安装）
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend deps
        run: npm ci
        working-directory: apps/desktop
      - name: Build APK
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: npx tauri android build --apk --target aarch64 --debug
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
